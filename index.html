<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата Wi-Fi — 5 грн/хв</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 28px 22px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 6px;
        }
        .price {
            text-align: center;
            font-size: 34px;
            font-weight: 700;
            color: #16a34a;
            margin: 10px 0 24px;
        }
        .price span {
            font-size: 15px;
            color: #64748b;
            font-weight: 400;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin-bottom: 12px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: 0.15s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .privat {
            background: #5b2c6f;
        }
        .mono {
            background: #000000;
        }
        .card-btn {
            background: #0ea5e9;
        }
        .copy-box {
            display: none;
            background: #f0f9ff;
            border: 2px dashed #0ea5e9;
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            margin-top: 8px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
        }
        .info {
            margin-top: 20px;
            font-size: 13px;
            color: #64748b;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Оплата Wi-Fi</h1>
        <div class="price">5 грн <span>/ 1 хвилина</span></div>

        <!-- Кнопки способів оплати -->
        <a href="https://www.privat24.ua/" target="_blank" class="btn privat">
            Оплатити через Приват24
        </a>

        <a href="https://www.monobank.ua/" target="_blank" class="btn mono">
            Оплатити через Monobank
        </a>

        <button class="btn card-btn" onclick="showCard()">
            Показати номер карти
        </button>

        <!-- Номер карти (з’являється після натискання) -->
        <div class="copy-box" id="cardBox" onclick="copyCard()">
            4149 4991 1234 5678
            <div style="font-size:13px; font-weight:400; margin-top:6px; color:#0369a1;">
                Натисни щоб скопіювати
            </div>
        </div>

        <div class="info">
            Після оплати напиши мені в Telegram<br>
            і я відкрию доступ протягом 1–2 хвилин
        </div>
    </div>

    <script>
        // Твій номер карти (заміни!)
        const CARD_NUMBER = "4149499112345678";

        function showCard() {
            const box = document.getElementById("cardBox");
            box.style.display = "block";
            box.innerHTML = CARD_NUMBER.replace(/(\d{4})/g, "$1 ").trim() + 
                `<div style="font-size:13px; font-weight:400; margin-top:6px; color:#0369a1;">
                    Натисни щоб скопіювати
                </div>`;
        }

        function copyCard() {
            navigator.clipboard.writeText(CARD_NUMBER).then(() => {
                alert("Номер карти скопійовано!");
            });
        }
    </script>
</body>
</html>
